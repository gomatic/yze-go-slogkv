# Soft-finding baselines: a RATCHET — counts may only fall. Exceeding one
# fails the build and names the rule; a rule absent here is permitted zero.
# `soft:` is what makes a rule non-gating; `soft-baseline:` is only the
# per-rule ceiling APPLIED TO the rules named here.

soft-baseline:
  # yze/enumdiscrim (permanent probe) and yze/fuzzreq (rollout) baselines,
  # recorded at the 2026-08-02 suite adoption. enumdiscrim findings are
  # if-shaped discriminations of >2-member const groups awaiting adjudication
  # (a deliberate fast path is legitimate; an incomplete discrimination is
  # not). fuzzreq findings are exported parser surfaces owed an asserting
  # fuzz target. Counts may only fall.
  yze/enumdiscrim: 1
